# =====================================================================
# 3Form WMS / MES / APS — tunable settings
# Change values here, then restart the server. No code edits needed.
# Secrets (passwords, API keys, DB URLs) live in .env, NOT in this file.
# =====================================================================

site:
  name: "3Form Demo Factory"
  code: "HK01"
  timezone: "Asia/Hong_Kong"
  industry: "cosmetics"          # one of config/industries/*.yaml
  languages: ["en", "zh-hant"]
  default_language: "en"

workstations:
  # How many workstations the demo factory has. Steps come from the
  # industry routing; extra workstations repeat the last step type.
  count: 6
  code_prefix: "WS"              # WS-01, WS-02, ...

ids:
  # Human-readable IDs, printed as barcodes. {date} = YYYYMMDD
  work_order: "WO-{date}-{seq:04d}"
  batch: "B-{date}-{seq:04d}"
  wip: "WIP-{batch}-S{step:02d}-{seq:03d}"

auth:
  manager_idle_timeout_minutes: 30     # PIC / EM auto-logout
  worker_session_hours: 12             # worker staff-ID session (one shift)
  max_failed_logins: 5                 # then account is locked
  lockout_minutes: 15
  password_min_length: 10

network_alarm:
  heartbeat_interval_seconds: 3        # how often screens / gateway check in
  timeout_seconds: 10                  # silence longer than this = alarm
  sound: true
  worker_poll_interval_ms: 1000        # worker page checks for new scans

scanner_gateway:
  # Each device's IP is mapped to one workstation (rack cameras: none). Add/replace hardware here.
  # kind: scanner (default) | vision | rack
  forward_url: "http://127.0.0.1:8008/api/v1/gateway"
  offline_queue_file: "logs/gateway_queue.sqlite3"
  retry_seconds: 5
  devices:
    - id: "SCN-01"
      driver: "honeywell_tcp"
      mode: "client"                   # client = gateway connects to scanner; server = scanner connects to gateway
      host: "127.0.0.1"                # scanner IP (127.0.0.1 = simulator)
      port: 55256
      terminator: "\r\n"
      workstation: "WS-01"
    - id: "SCN-02"
      driver: "honeywell_tcp"
      mode: "client"
      host: "127.0.0.1"
      port: 55257
      terminator: "\r\n"
      workstation: "WS-02"
    # Vision camera at the QC bench (Cognex In-Sight IS8500 set to send PASS / FAIL,<reason>)
    - id: "CAM-QC-01"
      kind: "vision"
      driver: "cognex_tcp"
      mode: "client"
      host: "127.0.0.1"                # camera IP (127.0.0.1 = tools/camera_simulator.py)
      port: 3000
      terminator: "\r\n"
      workstation: "WS-06"
    # Warehouse rack camera: SLOT,<bin>,EMPTY|OCCUPIED|<goods code>
    - id: "CAM-RACK-01"
      kind: "rack"
      driver: "rack_tcp"
      mode: "client"
      host: "127.0.0.1"
      port: 3100
      terminator: "\r\n"

mes:
  measurement_tolerance_pct: 2          # +/- band around a step's target (fill weight 50 g -> 49-51 g)
  allow_negative_good_qty: false

excel_export:
  max_rows_per_sheet: 200000
  nightly_hour: 2                       # 02:00 local time
  output_dir: "exports"

backup:
  output_dir: "backups"
  keep_days: 30

logging:
  dir: "logs"
  keep_days: 90
  level: "INFO"
  channels: ["app", "scanner", "camera", "aps", "agent", "audit"]

demo:
  # Used only by `python manage.py seed_demo`
  tenant_name: "3Form Demo"
  pic_username: "pic_demo"
  em_username: "em_demo"
  worker_staff_id: "1001"

public_demo:
  # Public website demo only. Switched on by the environment variable PUBLIC_DEMO=1 (never in a client install).
  ai_daily_calls: 30             # AI calls per day for the whole demo; after that, plain calculations
  reset_every_hours: 24          # all demo data is wiped and re-created when older than this
  reset_daily_at: "03:00"        # site time, while the demo is awake
  history_days: 90               # days of production history created on each reset
  worker_staff_id: "1001"        # who "Try the worker tablet" signs in as
  # Writes refused in public demo mode (URL prefixes). Reading is always allowed.
  blocked_writes:
    - "/api/v1/integrations/"    # AI key, ERP connections, API keys, ERP sync
    - "/api/v1/accounts"         # create / change people
    - "/api/v1/devices"          # register / revoke tablets
    - "/api/v1/sop"              # SOP uploads
    - "/admin/"
  # Old GreaterWMS screens are not part of the demo: every write outside /api/v1/ is refused.
  allow_writes_outside_api: false
  # Work in the scheduler that a demo does not need (backups, Excel files, ERP).
  skip_jobs: ["backup", "excel export", "erp sync"]

api:
  throttle_user: "1200/min"      # per logged-in person
  throttle_anon: "3000/min"      # per IP: health checks, gateway, login

lean:
  opportunities_per_unit: 1      # defect opportunities per piece (for DPMO / sigma)

spc:
  points: 150                    # readings shown on the SPC chart
  min_points: 20                 # readings needed before control limits are calculated

inventory:
  block_expired: true            # expired lots are never picked for production or shipping
  expiry_warn_days: 30           # alert this many days before a lot expires

aps:
  horizon_days: 14               # how far ahead the planner schedules
  slot_minutes: 5                # planning grid
  working_days: [0, 1, 2, 3, 4, 5]   # Mon=0 ... Sun=6  (Mon-Sat)
  shifts:                        # PIC can override these on the Calendar page
    - { code: "A", start: "08:00", end: "16:00", break_start: "12:00", break_minutes: 45, workers: 6 }
    - { code: "B", start: "16:00", end: "24:00", break_start: "20:00", break_minutes: 45, workers: 6 }
  workers_per_station: 1         # people needed while a workstation runs
  changeover_minutes: 20         # added when the next batch on a workstation is a different product
  # Saving changeovers (the PIC can also change these two on the Calendar page):
  changeover_cost_minutes: 30    # cuOpt: one changeover counts like this many minutes late (0 = ignore changeovers)
  group_same_product_days: 1     # built-in: run the same product next if its due date is within N days (0 = off)
  frozen_hours: 4                # the next N hours of the published plan do not move on re-plan
  late_buffer_hours: 4           # LATE RISK if finish > due date end-of-day minus this
  replan_on_stop_minutes: 30     # a machine stopped longer than this triggers a draft re-plan
  auto_replan: true              # re-plan automatically on new orders / material / long stops

optimiser:
  # Which engine plans production and orders pick routes. "builtin" (default, no extra hardware) or
  # "cuopt" (NVIDIA cuOpt server on a GPU machine; the PIC enters its address in Settings -> Integrations).
  # If cuOpt is chosen and cannot answer, nothing is changed: the last plan stays and a red alert is raised.
  plan_engine: "builtin"
  pick_engine: "builtin"
  builtin_exact_stops: 8          # built-in pick route tries every order up to this many bins (8 = 40,320 orders)
  cuopt:
    time_limit_seconds: 20        # how long cuOpt may search for a better answer
    poll_seconds: 1               # how often we ask cuOpt "is it ready?"
    wait_seconds: 120             # give up (and alert) if no answer by then
    max_binary_variables: 20000   # bigger planning problems are refused with a clear message
  # Planning goal (cuOpt): minutes late are costly, finishing earlier is a small bonus.
  late_minute_cost: 10
  urgent_multiplier: 10           # Special / Urgent orders
  priority_multiplier: { 1: 3, 2: 2, 3: 1, 4: 0.7, 5: 0.5 }   # client priority 1 = most important
  finish_minute_cost: 0.01

warehouse_layout:
  # Walking distance for pick routes. Each bin can have an aisle number and a position along the aisle
  # (set by the PIC on the Bins page). Aisles are joined by cross-aisles at the front (position 0) and the back.
  aisle_gap_m: 3.0                # distance between neighbouring aisles
  bin_pitch_m: 1.2                # distance between neighbouring positions in an aisle
  aisle_length_positions: 20      # positions per aisle (where the back cross-aisle is)
  depot: { aisle: 1, position: 0 } # where pickers start and finish (dispatch desk)

agent:
  enabled: true                   # master switch; each company can also switch AI off in Settings
  default_base_url: "https://api.deepseek.com"
  default_model: "deepseek-v4-pro"
  timeout_seconds: 90
  max_tool_rounds: 5              # chat: how many data look-ups the AI may chain
  job_max_tokens: 1200
  chat_max_tokens: 6000           # includes the model's thinking
  anonymise:                      # PENDING decision (2026-10-19): what is hidden before data leaves the site
    clients: true
    workers: true
    prices: true
    company: true
  stale_minutes_for_rerun: 55     # hourly job run skips if a run happened within this many minutes

search:
  vector_enabled: false          # switched off until an embedding source is chosen (decision 2026-10-19)
  vector_dimensions: 1024
  sop_chunk_chars: 900           # SOP text is split into passages of about this size
  sop_max_upload_mb: 20

erp:
  poll_minutes: 15               # how often released orders are pulled from each enabled ERP connection
  outbox_alert_minutes: 60       # alert when results could not be sent for this long
  workday_daily_hour: 3          # staff import time (Workday connections)
  timeout_seconds: 30
  default_batch_size: 1000        # imported orders are split into batches of at most this many pieces
  # Field names per ERP. Modelled on SAP S/4HANA OData (production orders) and Oracle Fusion
  # REST (work orders). Adjust per client: only this mapping changes, not the code.
  sap:
    orders_path: "/sap/opu/odata/sap/API_PRODUCTION_ORDER_2_SRV/A_ProductionOrder_2"
    orders_filter: "OrderIsReleased eq 'X'"
    results_path: "/sap/opu/odata/sap/API_PROD_ORDER_CONFIRMATION_2_SRV/ProdnOrdConf2"
    fields: { erp_ref: "ManufacturingOrder", product_code: "Material", qty: "TotalQuantity",
              due_date: "MfgOrderPlannedEndDate", client: "SalesOrderCustomer", priority: "MfgOrderPriority" }
  oracle:
    orders_path: "/fscmRestApi/resources/11.13.18.05/workOrders"
    orders_query: "WorkOrderStatusCode=RELEASED"
    results_path: "/fscmRestApi/resources/11.13.18.05/workOrderOperationTransactions"
    fields: { erp_ref: "WorkOrderNumber", product_code: "ItemNumber", qty: "PlannedStartQuantity",
              due_date: "PlannedCompletionDate", client: "CustomerName", priority: "WorkOrderPriority" }
  workday:
    staff_path: "/ccx/service/customreport2/staff_list"
    fields: { staff_id: "Employee_ID", name: "Worker", active: "Active" }

scheduler:
  # Used by `manage.py scheduler` inside Docker (edge box / cloud). On the Mac, crontab does the same.
  # every_minutes: N   |   hourly_at_minute: M   |   daily_at: "HH:MM"   (site time zone)
  jobs:
    - { name: "backup",          command: "backup_databases",  daily_at: "02:00" }
    - { name: "excel export",    command: "export_production", daily_at: "02:05" }
    - { name: "daily checks",    command: "daily_checks",      daily_at: "06:00" }
    - { name: "planner watch",   command: "aps_watch",         every_minutes: 5 }
    - { name: "agent (hourly)",  command: "agent_run",         hourly_at_minute: 7 }
    - { name: "agent (alarms)",  command: "agent_run", args: ["--if-pending"], every_minutes: 5 }
    - { name: "erp sync",        command: "erp_sync",          every_minutes: 5 }
