# Industry preset: Pharmaceutical.
label: { en: "Pharmaceutical", zh-hant: "製藥" }
sign_off_required: true          # EM e-signature at batch end
lot_tracking: true
steps:
  - { code: DISP, name: { en: "Dispensing", zh-hant: "配料" }, std_seconds_per_unit: 3.0, measurement: null }
  - { code: MIX, name: { en: "Granulation / mixing", zh-hant: "製粒 / 混合" }, std_seconds_per_unit: 2.5, measurement: null }
  - { code: FILL, name: { en: "Filling / tableting", zh-hant: "灌裝 / 壓片" }, std_seconds_per_unit: 1.5, measurement: { name: "Fill weight", unit: "g", target: 50.0 } }
  - { code: BLIST, name: { en: "Blistering", zh-hant: "泡罩包裝" }, std_seconds_per_unit: 1.2, measurement: null }
  - { code: PACK, name: { en: "Packaging", zh-hant: "包裝" }, std_seconds_per_unit: 2.0, measurement: null }
  - { code: QC, name: { en: "QC release", zh-hant: "品質放行" }, std_seconds_per_unit: 4.0, measurement: null, is_qc: true }
scrap_reasons: &default_scrap
  - { code: SPILL,   en: "Spill / overfill",   zh-hant: "溢出 / 過量" }
  - { code: UNDER,   en: "Underfill",          zh-hant: "不足量" }
  - { code: LEAK,    en: "Leak / seal fail",   zh-hant: "洩漏 / 密封不良" }
  - { code: LABEL,   en: "Label error",        zh-hant: "標籤錯誤" }
  - { code: DAMAGE,  en: "Damaged packaging",  zh-hant: "包裝損壞" }
  - { code: CONTAM,  en: "Contamination",      zh-hant: "污染" }
  - { code: MACHINE, en: "Machine fault",      zh-hant: "機器故障" }
  - { code: VISION,  en: "Vision reject",      zh-hant: "視覺檢測不合格", system_only: true }
  - { code: OTHER,   en: "Other (add note)",   zh-hant: "其他(請註明)", needs_note: true }
downtime_reasons:
  - { code: BREAKDOWN, en: "Breakdown",          zh-hant: "故障" }
  - { code: CHANGEOVER, en: "Changeover",        zh-hant: "換線" }
  - { code: MATERIAL,  en: "Waiting material",   zh-hant: "等待物料" }
  - { code: CLEANING,  en: "Cleaning",           zh-hant: "清潔" }
  - { code: BREAK,     en: "Staff break",        zh-hant: "休息" }
  - { code: OTHER,     en: "Other",              zh-hant: "其他" }
