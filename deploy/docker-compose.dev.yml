# Local development databases for 3Form WMS (Mac).
# Start:  docker compose --env-file .env -f deploy/docker-compose.dev.yml up -d
# Stop:   docker compose --env-file .env -f deploy/docker-compose.dev.yml down
name: threeform-wms-dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: threeform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Hong_Kong
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  mongo:
    # Atlas Local = MongoDB + Atlas Search / Vector Search on your own machine.
    image: mongodb/mongodb-atlas-local:latest
    container_name: threeform-mongo
    restart: unless-stopped
    hostname: threeform-mongo
    ports:
      - "127.0.0.1:${MONGO_PORT:-27032}:27017"
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
      - mongot:/data/mongot

volumes:
  pgdata:
  mongodata:
  mongoconfig:
  mongot:
