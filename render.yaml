services:
  - type: web
    name: 3form-wms-demo-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: 3form-wms-demo-api.onrender.com
      - key: SECRET_KEY
        generateValue: true
