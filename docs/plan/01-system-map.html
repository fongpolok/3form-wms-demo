<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3Form WMS · System map</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafaf7;
      --color-ink:    #1a1a1a;
      --color-muted:  #6b7280;
      --color-accent: #0050cc;
      --font-sans:  'Inter', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif: 'Source Serif 4', 'Noto Serif TC', serif;
      --font-mono:  ui-monospace, 'SF Mono', Menlo, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · 3Form WMS / MES / APS</p>
    <h1>System map: factory site and core</h1>

        <title id="system-map-title">System map: factory site and core</title>
        <desc id="system-map-desc">Scanners and cameras feed a site gateway inside the factory, which sends events to the core API; the core stores WMS data in PostgreSQL and production and search data in MongoDB, syncs work orders with the ERP, and an advisory agent reads the API and optionally calls DeepSeek.</desc>

        </defs>

        <rect width="100%" height="100%" fill="#fafaf7"/>

        <rect x="104" y="108" width="184" height="12" rx="2" fill="#fafaf7"/>
        <text x="196" y="117" fill="rgba(26,26,26,0.50)" font-size="7" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">FACTORY SITE · ALWAYS ON-PREMISE</text>

        <text x="644" y="117" fill="rgba(26,26,26,0.50)" font-size="7" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">CORE · EDGE BOX  OR  AZURE / AWS VM</text>
