<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3Form WMS · Production flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fafaf7;
      --color-ink:    #1a1a1a;
      --color-muted:  #6b7280;
      --color-accent: #0050cc;
      --font-sans:  'Inter', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif: 'Source Serif 4', 'Noto Serif TC', serif;
      --font-mono:  ui-monospace, 'SF Mono', Menlo, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · 3Form WMS / MES / APS</p>
    <h1>Production flow: order to client</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="production-flow-title production-flow-desc">
        <title id="production-flow-title">Production flow: order to client</title>
        <desc id="production-flow-desc">ERP and urgent PIC orders feed the APS plan, workstations run the MES steps, QC either sends the batch to FIFO stock or straight to the client or back as scrap, and step data feeds the agent's DMAIC advice into the next plan.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b7280"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0050cc"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b9bf0"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#fafaf7"/>

        <!-- Arrows -->
        <!-- ERP order -> APS -->
        <path d="M 168,180 H 184 Q 192,180 192,188 V 220 Q 192,228 200,228 H 216" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Urgent order -> APS -->
        <path d="M 168,292 H 184 Q 192,292 192,284 V 260 Q 192,252 200,252 H 216" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- APS -> MES -->
        <line x1="344" y1="240" x2="392" y2="240" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- MES -> QC -->
        <line x1="552" y1="240" x2="584" y2="240" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- QC pass, ship direct -> Client -->
        <line x1="664" y1="240" x2="872" y2="240" stroke="#0050cc" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- QC pass, to stock -> WMS -->
        <path d="M 624,200 V 172 Q 624,164 632,164 H 712" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- WMS -> Client (FIFO pick) -->
        <path d="M 848,164 H 920 Q 928,164 928,172 V 208" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- QC fail -> back to MES -->
        <path d="M 624,280 V 312 Q 624,320 616,320 H 480 Q 472,320 472,312 V 272" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- MES -> Agent (step data) -->
        <line x1="432" y1="272" x2="432" y2="376" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- Agent -> APS (advice) -->
        <path d="M 392,404 H 288 Q 280,404 280,396 V 272" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="348" y="220" width="40" height="12" rx="2" fill="#fafaf7"/>
        <text x="368" y="229" fill="#6b7280" font-size="8" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">PLAN</text>

        <rect x="744" y="220" width="72" height="12" rx="2" fill="#fafaf7"/>
        <text x="780" y="229" fill="#0050cc" font-size="8" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">SHIP DIRECT</text>

        <rect x="644" y="144" width="56" height="12" rx="2" fill="#fafaf7"/>
        <text x="672" y="153" fill="#6b7280" font-size="8" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">TO STOCK</text>

        <rect x="936" y="180" width="56" height="12" rx="2" fill="#fafaf7"/>
        <text x="964" y="189" fill="#6b7280" font-size="8" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">FIFO OUT</text>

        <rect x="508" y="326" width="80" height="12" rx="2" fill="#fafaf7"/>
        <text x="548" y="335" fill="#6b7280" font-size="8" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">FAIL · SCRAP</text>

        <rect x="360" y="336" width="64" height="12" rx="2" fill="#fafaf7"/>
        <text x="392" y="345" fill="#6b7280" font-size="8" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">STEP DATA</text>

        <rect x="300" y="384" width="52" height="12" rx="2" fill="#fafaf7"/>
        <text x="326" y="393" fill="#6b7280" font-size="8" font-family="ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">ADVICE</text>

        <!-- Node: ERP order (start oval) -->
        <rect x="40" y="152" width="128" height="56" rx="20" fill="#fafaf7"/>
        <rect x="40" y="152" width="128" height="56" rx="20" fill="rgba(26,26,26,0.03)" stroke="rgba(26,26,26,0.30)" stroke-width="1"/>
        <text x="104" y="177" fill="#1a1a1a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">ERP work order</text>
        <text x="104" y="193" fill="#6b7280" font-size="9" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">SAP · Oracle</text>

        <!-- Node: Urgent order (start oval) -->
        <rect x="40" y="264" width="128" height="56" rx="20" fill="#fafaf7"/>
        <rect x="40" y="264" width="128" height="56" rx="20" fill="rgba(107,114,128,0.10)" stroke="#374151" stroke-width="1"/>
        <text x="104" y="289" fill="#1a1a1a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">PIC urgent order</text>
        <text x="104" y="305" fill="#6b7280" font-size="9" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">jumps the queue</text>

        <!-- Node: APS -->
        <rect x="216" y="208" width="128" height="64" rx="6" fill="#fafaf7"/>
        <rect x="216" y="208" width="128" height="64" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
        <text x="280" y="236" fill="#1a1a1a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">APS plan</text>
        <text x="280" y="252" fill="#6b7280" font-size="9" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">sort → fit capacity</text>

        <!-- Node: MES steps (focal) -->
        <rect x="392" y="208" width="160" height="64" rx="6" fill="#fafaf7"/>
        <rect x="392" y="208" width="160" height="64" rx="6" fill="rgba(0,80,204,0.08)" stroke="#0050cc" stroke-width="1"/>
        <text x="472" y="236" fill="#1a1a1a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">MES workstations</text>
        <text x="472" y="252" fill="#6b7280" font-size="9" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">mix→fill→cap→label→pack</text>

        <!-- Node: QC decision -->
        <polygon points="584,240 624,200 664,240 624,280" fill="#fafaf7"/>
        <polygon points="584,240 624,200 664,240 624,280" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
        <text x="624" y="244" fill="#1a1a1a" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">QC pass?</text>

        <!-- Node: WMS stock -->
        <rect x="712" y="136" width="136" height="56" rx="6" fill="#fafaf7"/>
        <rect x="712" y="136" width="136" height="56" rx="6" fill="rgba(26,26,26,0.05)" stroke="#6b7280" stroke-width="1"/>
        <text x="780" y="161" fill="#1a1a1a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">WMS stock</text>
        <text x="780" y="177" fill="#6b7280" font-size="9" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">bin · batch ID</text>

        <!-- Node: Client (end oval) -->
        <rect x="872" y="208" width="104" height="64" rx="20" fill="#fafaf7"/>
        <rect x="872" y="208" width="104" height="64" rx="20" fill="rgba(26,26,26,0.03)" stroke="rgba(26,26,26,0.30)" stroke-width="1"/>
        <text x="924" y="236" fill="#1a1a1a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Client</text>
        <text x="924" y="252" fill="#6b7280" font-size="9" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">result → ERP</text>

        <!-- Node: Agent DMAIC (optional) -->
        <rect x="392" y="376" width="160" height="56" rx="6" fill="#fafaf7"/>
        <rect x="392" y="376" width="160" height="56" rx="6" fill="rgba(26,26,26,0.02)" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="472" y="401" fill="#1a1a1a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Agent · DMAIC</text>
        <text x="472" y="417" fill="#6b7280" font-size="9" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">Pareto · 5-Why · SPC</text>

        <!-- Annotation -->
        <text x="576" y="396" fill="#374151" font-size="14" font-style="italic" font-family="'Source Serif 4', serif">Advice only. The EM or PIC clicks Accept</text>
        <text x="576" y="414" fill="#374151" font-size="14" font-style="italic" font-family="'Source Serif 4', serif">before anything in the plan changes.</text>

        <!-- Legend strip -->
        <line x1="40" y1="456" x2="976" y2="456" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
        <text x="40" y="474" fill="#6b7280" font-size="8" font-family="ui-monospace, Menlo, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="488" width="14" height="10" rx="5" fill="rgba(26,26,26,0.03)" stroke="rgba(26,26,26,0.30)" stroke-width="1"/>
        <text x="60" y="496" fill="#6b7280" font-size="8.5" font-family="'Inter', sans-serif">Start / end</text>
        <rect x="140" y="488" width="14" height="10" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
        <text x="160" y="496" fill="#6b7280" font-size="8.5" font-family="'Inter', sans-serif">Step</text>
        <polygon points="228,493 235,486 242,493 235,500" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
        <text x="250" y="496" fill="#6b7280" font-size="8.5" font-family="'Inter', sans-serif">Decision</text>
        <rect x="320" y="488" width="14" height="10" rx="2" fill="rgba(0,80,204,0.08)" stroke="#0050cc" stroke-width="1"/>
        <text x="340" y="496" fill="#6b7280" font-size="8.5" font-family="'Inter', sans-serif">Focal: shop floor</text>
        <rect x="448" y="488" width="14" height="10" rx="2" fill="rgba(26,26,26,0.05)" stroke="#6b7280" stroke-width="1"/>
        <text x="468" y="496" fill="#6b7280" font-size="8.5" font-family="'Inter', sans-serif">Stock</text>
        <line x1="536" y1="493" x2="564" y2="493" stroke="#0050cc" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="572" y="496" fill="#6b7280" font-size="8.5" font-family="'Inter', sans-serif">Fastest path</text>
        <line x1="668" y1="493" x2="696" y2="493" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="704" y="496" fill="#6b7280" font-size="8.5" font-family="'Inter', sans-serif">Advisory loop (needs human accept)</text>
      </svg>
    </div>
  </div>
</body>
</html>
