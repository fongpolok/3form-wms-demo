name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  tests:
    name: Tests (PostgreSQL + MongoDB Atlas Local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: threeform_wms, POSTGRES_USER: threeform, POSTGRES_PASSWORD: ci-password }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U threeform" --health-interval 10s --health-timeout 5s --health-retries 10
      mongo:
        image: mongodb/mongodb-atlas-local:latest
        ports: ["27032:27017"]
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"
      POSTGRES_DB: threeform_wms
      POSTGRES_USER: threeform
      POSTGRES_PASSWORD: ci-password
      MONGO_URI: mongodb://127.0.0.1:27032/?directConnection=true
      GATEWAY_TOKEN: test-gateway-token
      INTEGRATION_KEY: 8Wv5bQm1b2t2kNfKJ6p4bY0rC3l2y1VJr8H0h9Pq7-s=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Wait for MongoDB (replica set ready)
        run: |
          python - <<'PY'
          import time, pymongo
          c = pymongo.MongoClient("mongodb://127.0.0.1:27032/?directConnection=true", serverSelectionTimeoutMS=2000)
          for _ in range(60):
              try:
                  c.admin.command("ping"); print("mongo up"); break
              except Exception:
                  time.sleep(3)
          PY
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest -p no:cacheprovider

  frontend:
    name: Front end build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t 3form-wms:ci .
